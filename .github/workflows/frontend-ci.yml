name: React Frontend CI

on: 
  push:
    branches: ["main", "sdmx-table-results"]
  pull_request: 
    branches: ["main", "sdmx-table-results"]

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Clone the React repository onto the runner
      - name: Checkout Code
        uses: actions/setup-node@v4

    # 2. Set up Node.js with caching enabled for speed
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: 
           node-version: 24
           cache: 'npm'

    # 3. Clean install exact dependency versions
      - name: Install Dependencies
        run: npm ci

    # 4. Run your React test suites
      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        
    # 5. Compile the production-ready build
      - name: Build Application
        run: npm run build
        env:
          # Pass your independent Python backend URL to React
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
      
